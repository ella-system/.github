name: Recalculate Target Date from Days

on:
  schedule:
    - cron: '*/15 * * * *'   # a cada 15 minutos
  workflow_dispatch:          # permite rodar manualmente pelo botão "Run workflow"

jobs:
  recalc:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_PAT }}
      ORG: ella-system
      PROJECT_NUMBER: 4   # <-- ajuste para o número real do seu Project
    steps:
      - name: Fetch project items and recalc dates
        run: |
          set -e

          # 1. Descobre o ID do Project e dos campos default
          PROJECT_JSON=$(gh api graphql -f query='
            query($org:String!, $number:Int!) {
              organization(login:$org) {
                projectV2(number:$number) {
                  id
                  fields(first:20) {
                    nodes {
                      ... on ProjectV2FieldCommon { id name }
                    }
                  }
                }
              }
            }' -f org="$ORG" -F number=$PROJECT_NUMBER)

          PROJECT_ID=$(echo "$PROJECT_JSON" | jq -r '.data.organization.projectV2.id')
          DAYS_FIELD_ID=$(echo "$PROJECT_JSON" | jq -r '.data.organization.projectV2.fields.nodes[] | select(.name=="Days") | .id')
          START_FIELD_ID=$(echo "$PROJECT_JSON" | jq -r '.data.organization.projectV2.fields.nodes[] | select(.name=="Start date") | .id')
          TARGET_FIELD_ID=$(echo "$PROJECT_JSON" | jq -r '.data.organization.projectV2.fields.nodes[] | select(.name=="Target date") | .id')

          # 2. Busca todos os itens do project com os valores atuais
          ITEMS_JSON=$(gh api graphql -f query='
            query($org:String!, $number:Int!) {
              organization(login:$org) {
                projectV2(number:$number) {
                  items(first:100) {
                    nodes {
                      id
                      fieldValues(first:20) {
                        nodes {
                          ... on ProjectV2ItemFieldNumberValue { number field { ... on ProjectV2FieldCommon { name } } }
                          ... on ProjectV2ItemFieldDateValue { date field { ... on ProjectV2FieldCommon { name } } }
                        }
                      }
                    }
                  }
                }
              }
            }' -f org="$ORG" -F number=$PROJECT_NUMBER)

          # 3. Para cada item, calcula targetDate = startDate + days e atualiza se necessário
          echo "$ITEMS_JSON" | jq -c '.data.organization.projectV2.items.nodes[]' | while read -r item; do
            ITEM_ID=$(echo "$item" | jq -r '.id')
            DAYS=$(echo "$item" | jq -r '.fieldValues.nodes[] | select(.field.name=="Days") | .number // empty')
            START=$(echo "$item" | jq -r '.fieldValues.nodes[] | select(.field.name=="Start date") | .date // empty')
            CURRENT_TARGET=$(echo "$item" | jq -r '.fieldValues.nodes[] | select(.field.name=="Target date") | .date // empty')

            if [ -n "$DAYS" ] && [ -n "$START" ]; then
              NEW_TARGET=$(date -u -d "$START + $DAYS days" +%Y-%m-%d)

              if [ "$NEW_TARGET" != "$CURRENT_TARGET" ]; then
                echo "Atualizando item $ITEM_ID: $CURRENT_TARGET -> $NEW_TARGET"
                gh api graphql -f query='
                  mutation($project:ID!, $item:ID!, $field:ID!, $date:Date!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $project,
                      itemId: $item,
                      fieldId: $field,
                      value: { date: $date }
                    }) {
                      projectV2Item { id }
                    }
                  }' -f project="$PROJECT_ID" -f item="$ITEM_ID" -f field="$TARGET_FIELD_ID" -F date="$NEW_TARGET"
              fi
            fi
          done
